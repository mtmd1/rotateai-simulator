# Default configuration for the STM32U5.
# https://www.st.com/resource/en/application_note/an5652-how-to-optimize-power-consumption-on-stm32u5-mcus-stmicroelectronics.pdf

[config]
sample_rate = 5         # Hz
voltage = 1.2           # VCORE Range 1 (Volts)
DMIPS_per_MHz = 1.5
uA_per_MHz = 51.6
max_frequency = 160     # MHz
sleep_current_uA = 10   # uA
# cmdline = "--strategy start --surface-depth 5 --dive-depth 10"
